services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arion_agent
      POSTGRES_USER: arion
      POSTGRES_PASSWORD: arion_dev
    ports:
      - '5432:5432'
    volumes:
      - ./.docker/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arion -d arion_agent']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is the `db` service, not localhost.
      - DATABASE_URL=postgres://arion:arion_dev@db:5432/arion_agent
      # WeChat (iLink) bot credentials — shared with the worker so a scan done
      # here in the dashboard is resumed by the worker's message loop.
      - WECHATBOT_DATA_DIR=/app/.wechatbot
    volumes:
      - ./.docker/wechatbot:/app/.wechatbot
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://arion:arion_dev@db:5432/arion_agent
      - WECHATBOT_DATA_DIR=/app/.wechatbot
    volumes:
      - ./.docker/lark-cli:/root/.lark-cli
      # WeChat (iLink) bot credentials — shared with the app (dashboard scan).
      - ./.docker/wechatbot:/app/.wechatbot
      # lark-cli file keychain: master.key + *.enc (app secret + user token).
      # Without this, credentials are lost on every container restart.
      - ./.docker/lark-cli-keychain:/root/.local/share/lark-cli
    depends_on:
      db:
        condition: service_healthy
